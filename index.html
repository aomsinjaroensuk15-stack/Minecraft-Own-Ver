<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>GL test</title>
<style>body{background:#111;color:#eee;font-family:monospace;font-size:15px;padding:16px}canvas{display:block;margin-top:14px;width:100%;max-width:400px}</style>
</head>
<body><div id="log">testing…</div><canvas id="c" width="320" height="180"></canvas>
<script>
const out = [];
const log = s => { out.push(s); document.getElementById('log').textContent = out.join('\n'); };
try {
  const gl2 = document.createElement('canvas').getContext('webgl2');
  log('WebGL2: ' + (gl2 ? 'YES' : 'no'));
  const gl = document.getElementById('c').getContext('webgl') || document.getElementById('c').getContext('experimental-webgl');
  log('WebGL1: ' + (gl ? 'YES' : 'NO'));
  if (gl) {
    log('renderer: ' + gl.getParameter(gl.RENDERER));
    ['OES_vertex_array_object','WEBGL_depth_texture','EXT_draw_buffers','OES_element_index_uint'].forEach(e => log(e + ': ' + (gl.getExtension(e) ? 'yes' : 'NO')));
    gl.viewport(0, 0, 320, 180);
    const vs = gl.createShader(gl.VERTEX_SHADER);
    gl.shaderSource(vs, 'attribute vec2 p;uniform float t;void main(){mat2 r=mat2(cos(t),-sin(t),sin(t),cos(t));gl_Position=vec4(r*p*0.7,0.,1.);}');
    gl.compileShader(vs);
    const fs = gl.createShader(gl.FRAGMENT_SHADER);
    gl.shaderSource(fs, 'precision mediump float;uniform float t;void main(){gl_FragColor=vec4(0.5+0.5*sin(t),0.5+0.5*cos(t*1.3),0.8,1.);}');
    gl.compileShader(fs);
    const pr = gl.createProgram();
    gl.attachShader(pr, vs); gl.attachShader(pr, fs); gl.linkProgram(pr);
    if (!gl.getProgramParameter(pr, gl.LINK_STATUS)) { log('LINK FAIL: ' + gl.getProgramInfoLog(pr)); }
    else {
      gl.useProgram(pr);
      const b = gl.createBuffer();
      gl.bindBuffer(gl.ARRAY_BUFFER, b);
      gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([0,0.8,-0.8,-0.6,0.8,-0.6]), gl.STATIC_DRAW);
      const loc = gl.getAttribLocation(pr, 'p');
      gl.enableVertexAttribArray(loc);
      gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
      const uT = gl.getUniformLocation(pr, 't');
      (function frame(ms) {
        gl.clearColor(0.05,0.05,0.08,1); gl.clear(gl.COLOR_BUFFER_BIT);
        gl.uniform1f(uT, ms / 1000);
        gl.drawArrays(gl.TRIANGLES, 0, 3);
        requestAnimationFrame(frame);
      })(0);
      log('>>> colorful triangle should spin below <<<');
    }
  }
} catch (e) { log('EXCEPTION: ' + e.message); }
</script>
</body>
</html>
